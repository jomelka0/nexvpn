<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nex</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <img class="logo" src="/logo.png" alt="Nex">
    <div class="ttl"><h1>Nex</h1><div id="subtitle" class="sub"> </div></div>
    <button class="ib" id="bRefresh" data-anim="spin" title="Обновить подписки"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    <button class="ib" id="bPing" data-anim="bounce" title="Проверить пинг"><svg viewBox="0 0 24 24"><path d="M4 20v-4M10 20v-8M16 20V8M22 20V4"/></svg></button>
    <button class="ib" id="bSettings" data-anim="turn" title="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div id="subbar" class="subbar"></div>
  <div id="chips" class="chips"></div>
  <section id="stats" class="stats"></section>
  <main id="list" class="list"></main>
</div>

<div id="overlay"></div>
<div id="sheet" class="sheet">
  <div class="handle"></div>
  <h2>Добавить подписку</h2>
  <div class="hint">vmess / vless / trojan / ss / Xray JSON</div>
  <div class="inp">
    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    <textarea id="inp" rows="2" placeholder="https://example.com/sub/xxxx" spellcheck="false"></textarea>
    <button id="bPaste" title="Вставить из буфера"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
  </div>
  <div id="err" class="err"></div>
  <button id="bImport" class="cta">Импортировать</button>
</div>

<div id="settings" class="panel">
  <header>
    <button class="ib" id="bBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2>Настройки</h2>
  </header>
  <div class="body" id="setBody"></div>
</div>
<div id="toast"></div>
<script>window.NEX_TOKEN="__TOKEN__";</script>
<script src="/app.js"></script>
</body>
</html>
