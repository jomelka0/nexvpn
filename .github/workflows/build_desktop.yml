name: Build Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'tools/ref/**'
      - '.github/workflows/build_desktop.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node desktop/test/unit.js
      - name: Download Xray
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir xray && unzip -q xray.zip -d xray
          ./xray/xray version
      - name: Validate generated configs with real Xray
        run: |
          node desktop/test/gen-configs.js /tmp/cfgs
          cd xray
          fail=0
          for f in /tmp/cfgs/*.json; do
            echo "== $f"
            ./xray run -test -c "$f" || fail=1
          done
          exit $fail

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package Nex.exe
        shell: bash
        run: |
          npm i -g @yao-pkg/pkg
          mkdir dist
          cd desktop
          pkg . --targets node20-win-x64 --output ../dist/Nex.exe
      - name: Add Xray core
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray
          Copy-Item xray/xray.exe, xray/geoip.dat, xray/geosite.dat dist/
          Compress-Archive -Path dist/* -DestinationPath Nex-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nex-windows
          path: Nex-Windows.zip
